<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TP3 - Analyse Sentiment YouTube</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>TP3 : Analyse Sentiment YouTube</h2>
    <p class="subtitle">Cloud Computing & MLOps</p>

    <!-- API Config & Status -->
    <div class="box api-box">
      <div class="status-row">
        <span>Statut API : <b id="statusText">Vérification...</b></span>
        <button id="toggleConfigBtn" class="small-btn">⚙️ Config</button>
      </div>
      <div id="configSection" class="config-section hidden">
        <label>URL API :</label>
        <input type="text" id="apiUrlInput" value="http://localhost:7860">
        <div class="config-actions">
          <button id="saveConfigBtn" class="small-btn">Enregistrer</button>
          <button id="testConfigBtn" class="small-btn">Tester</button>
        </div>
        <span id="configMsg"></span>
      </div>
    </div>

    <!-- Extraction Controls -->
    <div class="box control-box">
      <div class="form-group">
        <label for="commentLimitSelect">Nombre de commentaires :</label>
        <select id="commentLimitSelect">
          <option value="20">20</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
      </div>
      <button id="analyzeBtn" class="btn-primary">Analyser les commentaires</button>
    </div>

    <!-- Alert / Notice -->
    <div id="alertBanner" class="alert hidden">
      <span id="alertMessage"></span>
    </div>

    <!-- Loading message -->
    <div id="loadingState" class="loading hidden">
      <p>⏳ Extraction et analyse en cours...</p>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="hidden">
      <!-- Simple Summary Box -->
      <div class="box summary-box">
        <h3>Résultats de l'analyse</h3>
        <p>Sentiment dominant : <b id="predominantText">-</b> (Score : <span id="sentimentScore">0</span>)</p>
        <p>Confiance moyenne : <span id="avgConfidence">0%</span></p>

        <!-- Basic table for stats -->
        <table class="stats-table">
          <thead>
            <tr>
              <th>Classe</th>
              <th>Nombre</th>
              <th>Pourcentage</th>
            </tr>
          </thead>
          <tbody>
            <tr class="row-pos">
              <td>🟢 Positifs</td>
              <td id="posCount">0</td>
              <td id="posPct">0%</td>
            </tr>
            <tr class="row-neu">
              <td>🟡 Neutres</td>
              <td id="neuCount">0</td>
              <td id="neuPct">0%</td>
            </tr>
            <tr class="row-neg">
              <td>🔴 Négatifs</td>
              <td id="negCount">0</td>
              <td id="negPct">0%</td>
            </tr>
          </tbody>
        </table>

        <!-- Simple visual bar -->
        <div class="simple-bar">
          <div id="barPositive" class="bar-pos" style="width: 33%"></div>
          <div id="barNeutral" class="bar-neu" style="width: 33%"></div>
          <div id="barNegative" class="bar-neg" style="width: 34%"></div>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions-row">
        <button id="copySummaryBtn" class="small-btn">📋 Copier résumé</button>
        <button id="exportCsvBtn" class="small-btn">Export CSV</button>
        <button id="exportJsonBtn" class="small-btn">Export JSON</button>
      </div>

      <!-- Filters & Search -->
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">Tous (<span id="tabCountAll">0</span>)</button>
        <button class="filter-btn" data-filter="positive">Positifs (<span id="tabCountPos">0</span>)</button>
        <button class="filter-btn" data-filter="neutral">Neutres (<span id="tabCountNeu">0</span>)</button>
        <button class="filter-btn" data-filter="negative">Négatifs (<span id="tabCountNeg">0</span>)</button>
      </div>

      <input type="text" id="searchInput" placeholder="Filtrer les commentaires...">

      <!-- Comments List -->
      <div id="commentsFeed" class="comments-list">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
